<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    <title>Marcus Chan — Resume &amp; CV</title>
    <meta name="description" content="Technical Lead · Cloud &amp; Full-Stack. Download the curated resume or full CV.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-foreground: #09090B;
            --color-secondary: #3F3F46;
            --color-muted-fg: #475569;
            --color-border: #E4E4E7;
            --color-muted: #E8ECF0;
            --color-background: #FAFAFA;
            --color-card: #FFFFFF;
            --color-accent: #2563EB;
            --color-on-accent: #FFFFFF;
            --radius: 6px;
            --font-display: "Archivo", sans-serif;
            --font-body: "Space Grotesk", sans-serif;
            --ring: 0 0 0 2px var(--color-background), 0 0 0 4px var(--color-accent);
        }

        [data-theme="dark"] {
            --color-foreground: #FAFAFA;
            --color-secondary: #A1A1AA;
            --color-muted-fg: #A1A1AA;
            --color-border: #27272A;
            --color-muted: #18181B;
            --color-background: #09090B;
            --color-card: #0C0C0E;
            --color-accent: #3B82F6;
            --color-on-accent: #FFFFFF;
            --ring: 0 0 0 2px var(--color-background), 0 0 0 4px var(--color-accent);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
            .section { opacity: 1 !important; transform: none !important; }
            .hero-brand { opacity: 1 !important; transform: none !important; }
        }

        body {
            font-family: var(--font-body);
            line-height: 1.55;
            color: var(--color-foreground);
            background:
                linear-gradient(180deg, var(--color-muted) 0%, transparent 28%),
                var(--color-background);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            padding: clamp(12px, 2.2vw, 36px) clamp(12px, 4vw, 48px);
        }

        a {
            color: var(--color-accent);
        }

        a:focus-visible,
        button:focus-visible {
            outline: none;
            box-shadow: var(--ring);
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--color-foreground);
            font-size: 1rem;
        }

        .theme-toggle:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        /* Hero */
        .hero {
            padding: 12px 0 28px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--color-border);
            position: relative;
        }

        .hero::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 48px;
            height: 2px;
            background: var(--color-accent);
        }

        .hero-brand {
            font-family: var(--font-display);
            font-size: clamp(2.25rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
            color: var(--color-foreground);
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .hero-tagline {
            font-size: clamp(0.95rem, 1.1vw + 0.7rem, 1.15rem);
            color: var(--color-secondary);
            margin-bottom: 18px;
            max-width: min(42rem, 100%);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
        }

        .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .contact a {
            color: var(--color-secondary);
            text-decoration: none;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-card);
            cursor: pointer;
        }

        .contact a:hover {
            color: var(--color-accent);
            border-color: var(--color-accent);
        }

        .cta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-left: auto;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--color-accent);
            color: var(--color-on-accent);
            padding: 10px 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: var(--radius);
            border: 1px solid var(--color-accent);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .download-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            color: var(--color-on-accent);
        }

        .download-btn.secondary {
            background: var(--color-card);
            color: var(--color-foreground);
            border-color: var(--color-border);
        }

        .download-btn.secondary:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            filter: none;
        }

        .panel {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: clamp(16px, 2.2vw, 36px);
            width: 100%;
        }

        .resume-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.1fr);
            gap: clamp(16px, 2.5vw, 36px);
            align-items: start;
            width: 100%;
        }

        .main-col,
        .side-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .content-block,
        .experience-item {
            min-width: 0;
        }

        .section {
            margin-bottom: 22px;
            opacity: 0;
            transform: translateY(10px);
        }

        .section.revealed {
            opacity: 1;
            transform: none;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--color-foreground);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }

        .section-title::after {
            content: "";
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--color-accent), var(--color-border) 40%, transparent);
        }

        .section-title i {
            color: var(--color-accent);
            font-size: 0.9em;
        }

        .content-block {
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            background: var(--color-background);
        }

        .summary-text {
            color: var(--color-secondary);
            font-size: 0.95rem;
            border-left: 3px solid var(--color-accent);
            padding-left: 14px;
        }

        .experience-item {
            margin-bottom: 22px;
            padding-left: 18px;
            border-left: 2px solid var(--color-border);
            position: relative;
        }

        .experience-item:last-child { margin-bottom: 0; }

        .experience-item::before {
            content: "";
            position: absolute;
            left: -5px;
            top: 6px;
            width: 8px;
            height: 8px;
            background: var(--color-accent);
            border-radius: 1px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 4px;
        }

        .job-title {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .date {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-muted-fg);
            white-space: nowrap;
            border: 1px solid var(--color-border);
            padding: 3px 8px;
            border-radius: 4px;
            background: var(--color-card);
        }

        .company-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.92rem;
            color: var(--color-secondary);
            margin-bottom: 8px;
        }

        .company { font-weight: 600; }

        .location {
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--color-muted-fg);
        }

        .sub-role {
            font-weight: 700;
            margin-top: 12px;
            margin-bottom: 6px;
            font-size: 0.95rem;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--color-border);
        }

        .experience-content ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .experience-content li {
            padding-left: 16px;
            position: relative;
            color: var(--color-secondary);
            font-size: 0.9rem;
        }

        .experience-content li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.55em;
            width: 5px;
            height: 5px;
            background: var(--color-muted-fg);
        }

        .skill-category { margin-bottom: 14px; }
        .skill-category:last-child { margin-bottom: 0; }

        .category-name {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--color-muted-fg);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skill-tag {
            font-size: 0.75rem;
            background: var(--color-muted);
            color: var(--color-foreground);
            padding: 4px 9px;
            border-radius: 4px;
            border: 1px solid var(--color-border);
            font-weight: 500;
        }

        .cert-list, .edu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cert-item, .edu-item {
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .edu-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .cert-name, .edu-school {
            font-weight: 700;
            font-size: 0.9rem;
            font-family: var(--font-display);
        }

        .cert-org, .edu-meta {
            color: var(--color-muted-fg);
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .edu-degree {
            font-weight: 600;
            color: var(--color-accent);
            font-size: 0.88rem;
            margin-top: 4px;
        }

        .cert-year {
            font-weight: 600;
            color: var(--color-muted-fg);
            font-size: 0.78rem;
            border: 1px solid var(--color-border);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 240px;
            color: var(--color-secondary);
            gap: 12px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print {
            body::before {
                content: "For best printing results, use Download Resume / CV PDF.";
                display: block;
                padding: 16px;
                background: var(--color-muted);
                border: 1px solid var(--color-border);
                margin-bottom: 16px;
                text-align: center;
                font-weight: 600;
            }
            .theme-toggle, .cta-group { display: none !important; }
            .section { opacity: 1 !important; transform: none !important; }
            body { background: white; padding: 0; }
            .panel { border: none; padding: 0; }
        }

        /* Ultrawide: keep fluid stretch; slightly roomier type/gaps */
        @media (min-width: 1600px) {
            .hero-brand {
                font-size: clamp(2.75rem, 2.2vw, 3.5rem);
            }
            .resume-grid {
                grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
                gap: clamp(28px, 2vw, 48px);
            }
        }

        /* Tall / portrait desktop (vertical monitors) */
        @media (orientation: portrait) and (min-width: 768px) {
            .resume-grid {
                grid-template-columns: 1fr;
                max-width: 52rem;
                margin-inline: auto;
            }
            .hero {
                text-align: left;
            }
        }

        @media (max-width: 1024px) {
            .resume-grid {
                grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            }
        }

        @media (max-width: 900px) {
            .resume-grid { grid-template-columns: 1fr; gap: 12px; }
            .cta-group { margin-left: 0; width: 100%; }
            .download-btn { flex: 1 1 auto; justify-content: center; min-height: 44px; }
            .hero-actions { flex-direction: column; align-items: stretch; }
            .contact { justify-content: flex-start; }
            .theme-toggle { top: 10px; right: 10px; }
        }

        @media (max-width: 480px) {
            .contact a { font-size: 0.82rem; }
            .title-row, .company-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .cert-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle dark / light mode" aria-label="Toggle dark / light mode">
        <i class="fas fa-moon" aria-hidden="true"></i>
    </button>
    <div class="container">
        <div id="loading" class="loading" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <p>Loading profile…</p>
        </div>
        <div id="resume-content" class="panel" style="display: none;"></div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('i');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        setTheme(localStorage.getItem('theme') || 'light');

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const revealObserver = reduceMotion ? null : new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) entry.target.classList.add('revealed');
            });
        }, { threshold: 0.1 });

        async function loadResume() {
            try {
                const response = await fetch('https://marcuscjh.com/data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                console.error('Error loading resume data:', error);
                document.getElementById('loading').innerHTML =
                    '<p style="color:#DC2626;font-weight:600;">Error loading resume data. Please try again later.</p>';
            }
        }

        function renderResume(data) {
            const config = data.config || {};
            const timeline = data.timeline || [];
            const social = data.social || [];
            const skills = data.skills || {};
            const resumeContent = document.getElementById('resume-content');

            const workExp = timeline.filter((i) => i.category === 'work').sort((a, b) => (b.order || 0) - (a.order || 0));
            const education = timeline.filter((i) => i.category === 'education').sort((a, b) => (b.order || 0) - (a.order || 0));
            const certifications = timeline.filter((i) => i.category === 'certification').sort((a, b) => (b.order || 0) - (a.order || 0));

            const linkedin = social.find((s) => s.platform && s.platform.toLowerCase() === 'linkedin');
            const github = social.find((s) => s.platform && s.platform.toLowerCase() === 'github');

            const contactParts = [];
            if (config.email) contactParts.push(`<a href="mailto:${escapeHtml(config.email)}"><i class="fas fa-envelope" aria-hidden="true"></i> ${escapeHtml(config.email)}</a>`);
            if (config.website) contactParts.push(`<a href="${escapeHtml(config.website)}" target="_blank" rel="noopener noreferrer"><i class="fas fa-globe" aria-hidden="true"></i> ${escapeHtml(config.website.replace(/https?:\/\//, ''))}</a>`);
            if (linkedin && linkedin.url) contactParts.push(`<a href="${escapeHtml(linkedin.url)}" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn</a>`);
            if (github && github.url) contactParts.push(`<a href="${escapeHtml(github.url)}" target="_blank" rel="noopener noreferrer"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>`);

            const title = config.title || (config.cv && config.cv.title) || 'Technical Lead · Cloud & Full-Stack';
            const stamp = new Date().toISOString().slice(0, 10);

            let html = `
                <header class="hero">
                    <h1 class="hero-brand">${escapeHtml(config.real_name || config.name || 'Marcus Chan')}</h1>
                    <p class="hero-tagline">${escapeHtml(title)}</p>
                    <div class="hero-actions">
                        <div class="contact">${contactParts.join('')}</div>
                        <div class="cta-group">
                            <a class="download-btn" href="resume.pdf" download="MarcusCJH_Resume_${stamp}.pdf">
                                <i class="fas fa-file-arrow-down" aria-hidden="true"></i> Resume
                            </a>
                            <a class="download-btn secondary" href="cv.pdf" download="MarcusCJH_CV_${stamp}.pdf">
                                <i class="fas fa-file-lines" aria-hidden="true"></i> CV
                            </a>
                        </div>
                    </div>
                </header>

                <div class="resume-grid">
                    <div class="main-col">
                        ${config.summary ? `
                        <section class="section">
                            <h2 class="section-title"><i class="fas fa-user-tie" aria-hidden="true"></i> Summary</h2>
                            <div class="content-block">
                                <div class="summary-text">${escapeHtml(config.summary)}</div>
                            </div>
                        </section>` : ''}

                        <section class="section">
                            <h2 class="section-title"><i class="fas fa-briefcase" aria-hidden="true"></i> Experience</h2>
                            <div class="content-block">
                                ${workExp.map((item) => {
                                    const modal = item.modalContent || {};
                                    const details = modal.details || [];
                                    const location = modal.location || '';
                                    const dateRange = item.endDate && item.endDate !== 'Present'
                                        ? `${item.startDate} — ${item.endDate}`
                                        : `${item.startDate} — Present`;

                                    let expHtml = `
                                        <article class="experience-item">
                                            <div class="experience-header">
                                                <div class="title-row">
                                                    <div class="job-title">${escapeHtml(item.title || '')}</div>
                                                    <div class="date">${escapeHtml(dateRange)}</div>
                                                </div>
                                                <div class="company-row">
                                                    <div class="company">${escapeHtml(item.company || '')}</div>
                                                    ${location ? `<div class="location"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> ${escapeHtml(location)}</div>` : ''}
                                                </div>
                                            </div>
                                            <div class="experience-content">`;

                                    let currentListOpen = false;
                                    details.forEach((detail) => {
                                        const trimmed = detail.trim();
                                        if (!trimmed) return;
                                        const isSubRole = /\(.*?(?:Present|\d{4}).*?\)/.test(trimmed)
                                            || (trimmed.includes(' - ') && !trimmed.startsWith('  •') && trimmed.length < 150);

                                        if (isSubRole) {
                                            if (currentListOpen) { expHtml += `</ul>`; currentListOpen = false; }
                                            let subRoleHtml = trimmed.startsWith('•') ? trimmed.substring(1).trim() : trimmed;
                                            subRoleHtml = subRoleHtml.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                                            if (!trimmed.includes('**')) subRoleHtml = `<strong>${subRoleHtml}</strong>`;
                                            expHtml += `<div class="sub-role">${subRoleHtml}</div><ul>`;
                                            currentListOpen = true;
                                        } else {
                                            if (!currentListOpen) { expHtml += `<ul>`; currentListOpen = true; }
                                            const text = trimmed.replace(/^(\s*•|\s*-\s*)/, '').trim();
                                            expHtml += `<li>${escapeHtml(text)}</li>`;
                                        }
                                    });
                                    if (currentListOpen) expHtml += `</ul>`;
                                    expHtml += `</div></article>`;
                                    return expHtml;
                                }).join('')}
                            </div>
                        </section>
                    </div>

                    <div class="side-col">
                        <section class="section">
                            <h2 class="section-title"><i class="fas fa-tools" aria-hidden="true"></i> Skills</h2>
                            <div class="content-block">
                                ${Object.entries(skills).map(([category, technologies]) => {
                                    if (!technologies || !technologies.length) return '';
                                    const categoryName = category.replace(/_/g, ' & ').replace(/\b\w/g, (l) => l.toUpperCase());
                                    return `
                                        <div class="skill-category">
                                            <span class="category-name">${escapeHtml(categoryName)}</span>
                                            <div class="skill-tags">
                                                ${technologies.slice().sort().map((tech) => `<span class="skill-tag">${escapeHtml(tech)}</span>`).join('')}
                                            </div>
                                        </div>`;
                                }).join('')}
                            </div>
                        </section>

                        <section class="section">
                            <h2 class="section-title"><i class="fas fa-graduation-cap" aria-hidden="true"></i> Education</h2>
                            <div class="content-block">
                                <div class="edu-list">
                                    ${education.map((item) => `
                                        <div class="edu-item">
                                            <div class="edu-school">${escapeHtml(item.company || '')}</div>
                                            <div class="edu-degree">${escapeHtml(item.title || '')}</div>
                                            <div class="edu-meta">
                                                <span><i class="fas fa-calendar-alt" aria-hidden="true"></i> ${escapeHtml(item.startDate || '')}${item.endDate ? ' — ' + escapeHtml(item.endDate) : ''}</span>
                                            </div>
                                        </div>`).join('')}
                                </div>
                            </div>
                        </section>

                        <section class="section">
                            <h2 class="section-title"><i class="fas fa-certificate" aria-hidden="true"></i> Certifications</h2>
                            <div class="content-block">
                                <div class="cert-list">
                                    ${certifications.map((item) => {
                                        const year = (item.startDate || '').split(' ').pop() || '';
                                        return `
                                            <div class="cert-item">
                                                <div class="cert-info">
                                                    <div class="cert-name">${escapeHtml(item.title || '')}</div>
                                                    <div class="cert-org">${escapeHtml(item.company || '')}</div>
                                                </div>
                                                <div class="cert-year">${escapeHtml(year)}</div>
                                            </div>`;
                                    }).join('')}
                                </div>
                            </div>
                        </section>
                    </div>
                </div>`;

            resumeContent.innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            resumeContent.style.display = 'block';

            document.querySelectorAll('.section').forEach((section) => {
                if (reduceMotion) section.classList.add('revealed');
                else if (revealObserver) revealObserver.observe(section);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('beforeprint', () => window.open('resume.pdf', '_blank'));
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                window.open('resume.pdf', '_blank');
            }
        });

        loadResume();
    </script>
</body>
</html>
